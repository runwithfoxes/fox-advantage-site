<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Homepage · modules as a system</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#FAFAF8; --text:#1D1B1B; --muted:#8A8A85; --sky-blue:#3A7CA5; --deep-sky:#1A3A4E;
    --border:#E0E0DC; --card-hover:#F5F5F0; --cream:#F7EAD9; --fox-orange:#F47521;
    --sky-soft:rgba(58,124,165,0.10); --shadow:0 1px 2px rgba(29,27,27,.04), 0 8px 22px rgba(29,27,27,.06); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; font-weight:300; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; font-weight:300; }

  .section{ position:relative; max-width:1200px; margin:0 auto; padding:90px 48px; }
  .section::before{ content:""; position:absolute; inset:0; background-image:radial-gradient(circle,#d0d0cc .8px,transparent .8px);
    background-size:28px 28px; opacity:.4; pointer-events:none; z-index:0; }
  .section > *{ position:relative; z-index:1; }
  @media(max-width:768px){ .section{ padding:64px 24px; } }

  .intro{ max-width:680px; margin-bottom:40px; }
  .intro h2{ font-size:clamp(26px,3.4vw,36px); letter-spacing:-1px; line-height:1.15; }
  .intro h2 .hl{ color:var(--sky-blue); }
  .intro p{ font-size:13px; line-height:1.7; color:var(--muted); margin-top:14px; }

  .stage{ display:flex; gap:40px; align-items:flex-start; }
  @media(max-width:880px){ .stage{ flex-direction:column; } }

  /* rail */
  .rail{ flex:0 0 252px; }
  .rail-lbl{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:0 0 14px 2px; }
  .rail-list{ display:flex; flex-direction:column; gap:9px; }
  @media(max-width:880px){ .rail{ flex-basis:auto; width:100%; } }
  .mcard{ border:1px solid var(--border); border-radius:13px; background:var(--bg); box-shadow:var(--shadow); cursor:pointer; transition:border-color .2s, background .2s; }
  .mcard:hover{ background:var(--card-hover); }
  .mcard.active{ border-color:var(--sky-blue); background:var(--bg); }
  .mrow{ display:flex; align-items:center; gap:11px; padding:11px 14px; }
  .mrow .ic{ flex:none; width:30px; height:30px; border-radius:8px; background:var(--sky-soft); color:var(--sky-blue); display:flex; align-items:center; justify-content:center; }
  .mrow .ic svg{ width:16px; height:16px; }
  .mrow .tx{ flex:1; min-width:0; }
  .mrow .nm{ font-size:12.5px; color:var(--text); }
  .mrow .ds{ font-size:10px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .mrow .ct{ font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--muted); }

  /* canvas */
  .canvas{ flex:1; min-width:0; }
  .cv-head{ font-family:'Space Grotesk',sans-serif; font-size:19px; letter-spacing:-.4px; margin-bottom:5px; }
  .cv-sub{ font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:20px; max-width:60ch; }
  .tools{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(max-width:560px){ .tools{ grid-template-columns:1fr; } }
  .tool{ display:flex; gap:11px; align-items:flex-start; border:1px solid var(--border); border-radius:11px; background:var(--bg); box-shadow:var(--shadow); padding:11px 13px; transition:transform .2s ease-out; }
  .tool:hover{ transform:translateY(-1px); }
  .tool .td{ flex:none; width:7px; height:7px; border-radius:50%; background:var(--sky-blue); margin-top:5px; }
  .tool .tn{ font-size:12px; color:var(--text); margin-bottom:3px; }
  .tool .ts{ font-size:10.5px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>

  <section class="section">
    <div class="intro">
      <h2>Where can <span class="hl">AI</span> be built into marketing?</h2>
      <p>A marketing team of two or three, with the right systems, can do work that used to need a department. Pick an area to see what is inside it.</p>
    </div>

    <div class="stage">
      <div class="rail">
        <div class="rail-lbl">The department</div>
        <div class="rail-list" id="rail"></div>
      </div>
      <div class="canvas" id="canvas"></div>
    </div>
  </section>

<script>
const el = h => { const d=document.createElement('template'); d.innerHTML=h.trim(); return d.content.firstChild; };
const I = {
  eff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="10"/></svg>',
  seg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><circle cx="17" cy="14" r="4"/><circle cx="9" cy="17" r="3"/></svg>',
  brand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M9 21h6"/></svg>',
  ad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M10 9l5 3-5 3z"/></svg>',
  studio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',
  bd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M16 8h5v5"/></svg>',
  res:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
};

const MODS = [
  { key:'eff', icon:'eff', name:'Marketing effectiveness', desc:'Which metrics matter, and how they move each other',
    tools:[
      ['Measurement training','Train the team across the five levels of measurement.'],
      ['Metrics audit','Sort what you track into five levels and show the gaps.'],
      ['Brand scorecard','One scorecard: commercial, behaviour, memory, comms, activity.'],
      ['Brand / activation split','The 60:40 balance, set on evidence.']
    ]},
  { key:'seg', icon:'seg', name:'Segmentation', desc:'Proper segmentation, with the maths actually run',
    tools:[
      ['What segmentation is','The grounding before the maths.'],
      ['What holds up','Which segments survive the data.'],
      ['Similarity analysis','How close the segments really are.'],
      ['Scatter plots','See the segments laid out.']
    ]},
  { key:'brand', icon:'brand', name:'Brand strategy', desc:'Positioning, messaging, mental availability, assets',
    tools:[
      ['Competitor positioning map','Claimed vs actual positions, and the white space.'],
      ['Mental availability','The buying situations to be remembered in.'],
      ['Messaging framework','The pillars all copy anchors to.'],
      ['Distinctive brand assets','The things people recognise you by.'],
      ['Brand on a page','The whole strategy on a single page.'],
      ['Brand guidelines','How the brand is used, kept consistent.']
    ]},
  { key:'ad', icon:'ad', name:'Advertising', desc:'Brief to useful options faster, quality first',
    tools:[
      ['Video','From brief to options faster.'],
      ['Brand ads','The cinematic brand work.'],
      ['Animated ads','Motion built for the feed.'],
      ['Static ads','The full IAB set, on brand.']
    ]},
  { key:'studio', icon:'studio', name:'Studio', desc:'Twenty years of studio craft, with AI inside',
    tools:[
      ['Marketing calendar','The spine the work runs on.'],
      ['Studio measurement','What the studio shipped, and its effect.'],
      ['Brief coach','Sharpen the brief before work starts.']
    ]},
  { key:'bd', icon:'bd', name:'Business development', desc:'AI for sales, outreach and GTM',
    tools:[
      ['Business development rep','Runs the lists and the outreach, you approve.']
    ]},
  { key:'res', icon:'res', name:'Research and insights', desc:'Message testing, intelligence, interviews by phone',
    tools:[
      ['AI research interviewer','Agents that call and interview people.'],
      ['Company intelligence','What is going on inside a target company.'],
      ['Review intelligence','What customers say, at scale.'],
      ['Pricing intelligence','Monitor pricing across the market.']
    ]}
];

function render(mod){
  const c = document.getElementById('canvas');
  c.innerHTML = '';
  c.appendChild(el(`<div class="cv-head">${mod.name}</div>`));
  c.appendChild(el(`<div class="cv-sub">${mod.desc}</div>`));
  const grid = el('<div class="tools"></div>');
  mod.tools.forEach(([n,s])=> grid.appendChild(el(`<div class="tool"><span class="td"></span><div><div class="tn">${n}</div><div class="ts">${s}</div></div></div>`)));
  c.appendChild(grid);
}

const rail = document.getElementById('rail');
MODS.forEach((m,i)=>{
  const card = el(`<div class="mcard ${i===0?'active':''}" role="button" tabindex="0">
    <div class="mrow">
      <span class="ic">${I[m.icon]}</span>
      <span class="tx"><span class="nm">${m.name}</span><span class="ds">${m.desc}</span></span>
      <span class="ct">${m.tools.length}</span>
    </div>
  </div>`);
  const pick = ()=>{ document.querySelectorAll('.mcard').forEach(x=>x.classList.remove('active')); card.classList.add('active'); render(m); };
  card.addEventListener('click', pick);
  card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); }});
  rail.appendChild(card);
});
render(MODS[0]);
</script>
</body>
</html>
