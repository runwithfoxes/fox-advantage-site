<!doctype html>

<title>The Fox Advantage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one book on a desk. A thin tool rail above, a progress rail below, the open spread fills everything between. */
:root{
  --accent:#3A7CA5; --desk:#d9dde0; --desk-2:#c5cbd0; --paper:#fbfbf7; --paper-edge:#e9e9e2; --ink:#1b1d21; --muted:#6a6f78;
  --rule:#d5d6cf; --chrome:#22262b; --mark:#ffe27a; --shade:rgba(20,24,30,.28); --on-accent:#fff;
  --display:"Space Grotesk",Georgia,"Times New Roman",serif; --body:"Source Serif 4",Georgia,"Iowan Old Style","Times New Roman",serif; --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pw:400px; --ph:570px; --fs:16px; --pad:36px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#F47521; --desk:#111418; --desk-2:#0a0c0f; --paper:#1d2126; --paper-edge:#15181c; --ink:#e4e2da; --muted:#8f949c;
  --rule:#343a42; --chrome:#d6d9de; --mark:#6b5a12; --shade:rgba(0,0,0,.55); --on-accent:#10131a; color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#F47521; --desk:#111418; --desk-2:#0a0c0f; --paper:#1d2126; --paper-edge:#15181c; --ink:#e4e2da; --muted:#8f949c;
  --rule:#343a42; --chrome:#d6d9de; --mark:#6b5a12; --shade:rgba(0,0,0,.55); --on-accent:#10131a; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 35%,var(--desk),var(--desk-2));color:var(--ink);font-family:var(--ui);overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box}[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-width:0}

/* rails */
.bar{display:flex;align-items:center;gap:4px;padding:6px 16px;color:var(--chrome);min-width:0}
.bar .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--display);font-size:15px;padding-inline:8px}
.bar .name small{font-family:var(--ui);font-size:12px;color:var(--muted);margin-left:10px}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;flex:none;font-size:13px;font-weight:600}
.ib:hover{background:color-mix(in srgb,var(--chrome) 12%,transparent)}
.ib[aria-pressed="true"]{color:var(--accent)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.foot{display:flex;align-items:center;gap:14px;padding:6px 16px 10px;color:var(--chrome);font-size:12px;font-variant-numeric:tabular-nums;min-width:0}
.foot input{flex:1;min-width:0;accent-color:var(--accent);height:22px}
.foot span{white-space:nowrap}
#left{color:var(--muted)}

/* the book */
#stage{position:relative;min-height:0;min-width:0;display:grid;place-items:center;padding:4px 16px;perspective:2600px;touch-action:pan-y}
#book{position:relative;width:calc(var(--pw)*2);height:var(--ph);transform-style:preserve-3d;transition:translate .7s cubic-bezier(.4,.1,.2,1)}
#book.single{width:var(--pw)}
#book.closed{translate:calc(var(--pw)*-.5) 0}
.side{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.side.L{left:0}.side.R{right:0}
#book.single .side.L{display:none}
.page{position:absolute;inset:0;background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--body);font-size:var(--fs);line-height:1.52;
  box-shadow:0 1px 0 var(--paper-edge),0 18px 40px -18px var(--shade)}
.page.void{background:none;box-shadow:none;visibility:hidden}
.side.L .page,.face.back .page{border-radius:5px 0 0 5px}
.side.R .page,.face.front .page{border-radius:0 5px 5px 0}
#book.single .page{border-radius:4px}
/* gutter shading: the paper bends into the spine */
.side.L .page::after,.face.back .page::after{content:"";position:absolute;inset:0 0 0 auto;width:9%;background:linear-gradient(90deg,transparent,var(--shade));opacity:.45;pointer-events:none}
.side.R .page::after,.face.front .page::after{content:"";position:absolute;inset:0 auto 0 0;width:9%;background:linear-gradient(270deg,transparent,var(--shade));opacity:.45;pointer-events:none}
#book.single .page::after{display:none}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:5;will-change:transform}
.leaf.fwd{right:0;transform-origin:left center}.leaf.back{left:0;transform-origin:right center}
#book.single .leaf{left:0;right:auto;transform-origin:left center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.leaf.back .face.front{transform:rotateY(180deg)}.leaf.back .face.back{transform:none}
.face i.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.edge{position:absolute;top:0;bottom:0;width:22%;z-index:6;cursor:pointer}
.edge.prev{left:0}.edge.next{right:0}
.edge::after{content:"";position:absolute;bottom:0;width:0;height:0;transition:all .25s;border-style:solid;border-color:transparent;filter:drop-shadow(-2px -2px 3px var(--shade))}
.edge.next::after{right:0;border-width:0 0 0 0;border-left-color:var(--desk)}
.edge.next:hover::after{border-width:26px 26px 0 0;border-top-color:var(--paper-edge);border-right-color:var(--desk)}
.edge.prev::after{left:0}
.edge.prev:hover::after{border-width:26px 0 0 26px;border-top-color:var(--paper-edge);border-left-color:var(--desk)}

/* page furniture */
.inner{position:absolute;inset:calc(var(--pad)*1.25) var(--pad) calc(var(--pad)*1.3);overflow:hidden}
.runhead,.folio{position:absolute;left:var(--pad);right:var(--pad);font-family:var(--ui);font-size:max(9.5px,.62em);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px;white-space:nowrap;overflow:hidden}
.runhead{top:calc(var(--pad)*.5)}.runhead span{overflow:hidden;text-overflow:ellipsis}
.folio{bottom:calc(var(--pad)*.5);justify-content:center;font-variant-numeric:tabular-nums}
.ribbon{position:absolute;top:0;right:calc(var(--pad)*.7);width:16px;height:44px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);transform-origin:top;animation:drop .35s both}
@keyframes drop{from{transform:scaleY(0)}}

/* text */
.inner p{margin:0;text-align:justify;hyphens:auto;-webkit-hyphens:auto;text-indent:1.4em;overflow-wrap:break-word}
.inner p.first,.inner p.cont,.inner h1+p,.inner h2+p,.inner h3+p,.inner figure+p,.inner ul+p,.inner ol+p,.inner blockquote+p,.inner table+p,.inner .chap+p{text-indent:0}
.inner p.split{text-align-last:justify}
.inner p.small{font-size:.85em;color:var(--muted);text-indent:0;margin-top:.5em}
.inner p.lead::first-letter{font-family:var(--display);float:left;font-size:3.45em;line-height:.82;padding:.06em .08em 0 0;color:var(--accent);font-weight:600}
.inner h2,.inner h3{font-family:var(--display);line-height:1.2;margin:1.3em 0 .5em;text-wrap:balance;font-weight:600}
.inner h2{font-size:1.32em}.inner h3{font-size:1.06em;letter-spacing:.01em}
.inner > :first-child{margin-top:0}
.chap{padding-top:calc(var(--ph)*.13);margin-bottom:1.6em}
.chap .no{display:block;font-family:var(--ui);font-size:.72em;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.9em}
.chap h1{font-family:var(--display);font-size:2.05em;line-height:1.08;margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
.chap .rule{display:block;height:2px;width:3.2em;background:var(--accent);margin-top:1.1em;transform-origin:left}
.inner ul,.inner ol{margin:.6em 0;padding-left:1.35em}.inner li{margin:.22em 0}.inner li::marker{color:var(--accent)}
.inner blockquote{margin:1em 0;padding-left:1em;border-left:2px solid var(--accent);font-family:var(--display);font-size:1.16em;line-height:1.35;font-style:italic}
.inner figure{margin:1em auto;text-align:center}
.inner figure img{display:block;margin:0 auto;border-radius:2px;cursor:zoom-in;background:#fff}
.inner figcaption{font-family:var(--ui);font-size:.72em;line-height:1.4;color:var(--muted);margin-top:.6em;text-wrap:balance}
.inner table{border-collapse:collapse;width:100%;margin:1em 0;font-family:var(--ui);font-size:.74em;line-height:1.35;font-variant-numeric:tabular-nums}
.inner th,.inner td{text-align:left;padding:.42em .5em;border-bottom:1px solid var(--rule);vertical-align:top}
.inner th{font-weight:600;border-bottom-color:var(--ink)}
.inner pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.74em;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;background:color-mix(in srgb,var(--ink) 6%,transparent);padding:.8em;border-radius:4px;margin:.8em 0}
.inner code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.inner a{color:var(--accent);text-underline-offset:2px}
.inner sup{font-size:.68em;line-height:0}
mark{background:var(--mark);color:inherit;border-radius:2px}
.page.full .inner{inset:0}.page.full img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.page.full .runhead,.page.full .folio{display:none}

/* cover + last page */
.page.cover{background:var(--accent);color:var(--on-accent)}
.page.cover canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5;mix-blend-mode:soft-light}
.page.cover img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv{position:absolute;inset:calc(var(--pad)*1.2);display:flex;flex-direction:column;justify-content:space-between}
.cv h1{font-family:var(--display);font-size:calc(var(--pw)*.105);line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance;font-weight:600;overflow-wrap:break-word}
.cv .sub{font-family:var(--body);font-size:calc(var(--pw)*.042);line-height:1.3;margin-top:.9em;opacity:.9;font-style:italic}
.cv .by{font-family:var(--ui);font-size:calc(var(--pw)*.03);letter-spacing:.16em;text-transform:uppercase}
.cv .open{font-family:var(--ui);font-size:calc(var(--pw)*.027);letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-top:.8em}
.page.end .inner{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1em;font-family:var(--ui);font-size:.8em;color:var(--muted)}
.page.end b{font-family:var(--display);font-size:1.7em;color:var(--ink);font-weight:600}
.page.end button{border:1px solid var(--rule);padding:.6em 1.1em;border-radius:99px;color:var(--ink)}

/* things that move when a page arrives */
@media (prefers-reduced-motion:no-preference){
  .enter .chap .no{animation:rise .6s var(--d,0s) both}
  .enter .chap h1{animation:rise .7s calc(var(--d,0s) + .08s) both}
  .enter .chap .rule{animation:draw .7s calc(var(--d,0s) + .3s) both}
  .enter p.lead::first-letter{animation:ink .9s calc(var(--d,0s) + .35s) both}
  .enter figure img{animation:develop .9s calc(var(--d,0s) + .1s) both}
  .enter blockquote{animation:rise .7s calc(var(--d,0s) + .15s) both}
  .cover.enter .cv h1{animation:rise .9s .1s both}.cover.enter .cv .sub{animation:rise .9s .25s both}.cover.enter .cv .by{animation:rise .9s .4s both}
}
@keyframes rise{from{opacity:0;transform:translateY(.7em)}}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes ink{from{color:transparent}}
@keyframes develop{from{opacity:0;filter:blur(6px) saturate(.2);transform:scale(.985)}}

/* drawers */
.drawer{position:absolute;z-index:20;top:50px;bottom:44px;left:16px;width:min(360px,calc(100% - 32px));background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:10px;box-shadow:0 24px 60px -20px var(--shade);display:flex;flex-direction:column;overflow:hidden}
.drawer.right{left:auto;right:16px}
.drawer h2{font-family:var(--ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;padding:14px 16px 8px}
.drawer .list{overflow:auto;padding:0 6px 10px;flex:1}
.drawer .row{display:flex;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.35;align-items:baseline}
.drawer .row:hover,.drawer .row.cur{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.drawer .row.l2{padding-left:26px;font-size:13px;color:var(--muted)}
.drawer .row span:first-child{flex:1;min-width:0}
.drawer .row .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.drawer input{margin:0 12px 8px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:transparent;color:inherit;font:inherit;font-size:15px}
.drawer .empty{padding:10px 16px;color:var(--muted);font-size:13px}
#toast{position:absolute;z-index:15;left:50%;bottom:54px;translate:-50% 0;background:var(--chrome);color:var(--desk);padding:9px 14px;border-radius:99px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px -10px var(--shade);white-space:nowrap}
#toast button{text-decoration:underline;text-underline-offset:3px}
#light{position:absolute;inset:0;z-index:30;background:color-mix(in srgb,var(--desk-2) 92%,transparent);display:grid;place-items:center;padding:16px;cursor:zoom-out}
#light img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px;box-shadow:0 30px 80px -20px var(--shade)}
#measure{position:absolute;visibility:hidden;pointer-events:none;left:-9999px;top:0;width:var(--pw);height:var(--ph)}
@media (max-width:560px){.bar .name,#left,.ib.wide{display:none}.bar{justify-content:space-between}}
</style>

1oX/BPzwPpRR57O+1Rx/wA/dyVB/ACiis+Vvqxuq1rZHrPhv9nTw/4WgRNL0Wx08joY4wW/76611tp8N44c7zGB2KA0UUvYQerIeJqbGnD4Fs0XBBY+uKmHguyA+6/58/nRRWvsodjL21TuKPBtkOcSf99f/WqVPCdmhB2OR6Fv/rUUU/Zw7C9tPuWh4dsv+fZM1LDottB9yBFz7ZooquWK6GftJvqSjToR/wAsY/8AvgU4afECCI0B9Qooop2QuZkgt6XyBRRTJuxwhx3oEIFFFAXYvl+5zR5Yx1oooC4ojHvR5YHaiigQvlgdqXb7UUU7AG2l20UU7E3FxRtFFFAXALS49qKKAuAU+lLsPpRRTATafSl2miigA2ml2UUUCF2Uu0UUUALRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAf/Z","cover_text":false},"blocks":[{"type":"h1","text":"What just collapsed"},{"type":"p","runs":[{"t":"Most books about AI sound like TED talks or tech manifestos. This won't be one of those."}]},{"type":"p","runs":[{"t":"This is a book for marketers who feel the shift but haven't had the words, or structure, to act on it. Who sense the system wobbling beneath their team, but keep getting pulled back into slide reviews, vendor calls, and campaign calendars."}]},{"type":"p","runs":[{"t":"I'm writing this book because I was one of them."}]},{"type":"p","runs":[{"t":"I've managed brands and brand teams for household names, iconic brands, B2B tech and national institutions. I've trained teams in effectiveness, restructured agency models, and built campaigns that moved business, not just metrics. And still, when AI properly landed, my first instinct was scepticism."}]},{"type":"p","runs":[{"t":"Then I saw it work. Faster than me. Faster than a whole team. Not perfect. But sharp enough to matter, and fast enough to change the game. That's when I realised: the value of marketing hasn't disappeared. It's just moved. But we are still looking for it in the wrong places."}]},{"type":"p","runs":[{"t":"This book isn't a prediction. It's a practical strategy. You'll get a diagnosis of what's already broken and what's worth keeping. A way to reframe your role as a human with real leverage. A set of mental upgrades, habits, and tools to stay essential. A team playbook for collapsing old structures and building sharper ones. And a blueprint for leading, not just surviving, the AI era."}]},{"type":"p","runs":[{"t":"Why \"The Fox\"? Because marketing doesn't need another hedgehog, spiky, specialised, stuck. It needs something faster. Smarter. More adaptive. The fox doesn't panic when the rules change. It rewires how it moves. More on this later."}]},{"type":"p","runs":[{"t":"Super short chapters. No padding. Designed to read on your phone screen."}]},{"type":"h1","text":"The marketing department autopsy report"},{"type":"p","runs":[{"t":"I was in a planning meeting recently that took three hours. Three hours to agree not more than a headline. By the time we'd finished, a competitor had already shipped something similar and moved on to the next thing."}]},{"type":"p","runs":[{"t":"This is what we built. We built marketing like a civil service. Layered. Titled. Ritualised. The strategist thinks. The creative director adds vision. The copywriter adds words. The designer adds polish. The social team schedules it. The compliance team deletes half of it."}]},{"type":"p","runs":[{"t":"Three weeks later, something stumbles out the door. It's late. It's beige. It cost a fortune. Meanwhile, a 23-year-old with Claude and Midjourney shipped three campaigns before we agreed if the headline should say \"empowering\" or \"enabling\"."}]},{"type":"p","runs":[{"t":"We didn't just build a slow system. We built one optimised for a world that no longer exists. Like a loyalty card for a DVD rental shop."}]},{"type":"p","runs":[{"t":"Let's not call this a disruption. Let's call it what it is. Small teams with tools are now moving faster than big teams with process. While some are still rewriting the brief, others have already tested five ideas and moved on. The specialist stack wasn't streamlined. It was sidelined."}]},{"type":"p","runs":[{"t":"We used to pay for execution. Design. Craft. Copy. Now most of that is cheaper, faster and often, if I'm being honest, often better when done by machine. If your value is tied to what you produce, you've probably already been replaced. You just haven't been told yet."}]},{"type":"p","runs":[{"t":"We were trained to be hedgehogs. Pick a lane. Stay there. Climb the ladder. But the foxes, the curious, cross-trained, judgment-led ones, are moving faster, breaking rules, and skipping the whole approval chain."}]},{"type":"p","runs":[{"t":"AI makes average execution free. So the value has moved. You're not paid for your polish anymore. You're paid for your taste. Not whether you can write the ad, but whether you can tell the difference between an ad that works and one that just fills space."}]},{"type":"p","runs":[{"t":"Your job now is to spot the tension before the brief. To choose the 10x idea over the 10th revision. To move fast without losing the plot."}]},{"type":"p","runs":[{"t":"So how do we fix this? That six-person social pod? It's now two generalists with taste, AI tools, and the permission to act. The old model was \"I do my bit, then pass it along.\" The new model is \"I can make the call, do the work, and hit publish before lunch.\" This isn't about finding unicorns. It's about removing the need for unicorns."}]},{"type":"p","runs":[{"t":"Our seven-layer approval chain isn't quality control. It's momentum loss. Sharp teams set boundaries, act fast, and review while it still matters. Not \"Is this perfect?\" but \"Did it work?\" As my dad, a doctor, used to say: \"Don't wait for the autopsy to fix something you could've caught in triage.\""}]},{"type":"p","runs":[{"t":"Nobody cares how many banners we shipped. Start tracking how fast you move from insight to action. That's the real metric now. Every handoff slows you down. Every sync meeting is a tax. Every job title that starts with \"liaison\" should come with a warning label."}]},{"type":"p","runs":[{"t":"Smart teams won't make coordination more efficient. They'll make it unnecessary."}]},{"type":"h1","text":"The robots aren't coming. They've already moved in"},{"type":"p","runs":[{"t":"I watched a junior marketer on the Luas, building a campaign in the notes app. He had one earbud in, the other dangling, and he was flicking between a prompt, a doc, and a half-finished landing page like it was nothing. At one point the train jolted, his thumb hit send, and the tool still spat back three usable headlines before we got to the next stop. It was weirdly calm. Not heroic. Just normal."}]},{"type":"p","runs":[{"t":"That’s what messes with your head. The work isn’t brilliant, but it is fast enough to change who needs to be in the room."}]},{"type":"p","runs":[{"t":"For years we built marketing like a relay race. Strategy hands to creative. Creative hands to design. Design hands to web. Web hands to analytics. Someone somewhere produces a deck to prove it’s all connected. Each handoff adds cost, time, and a new chance to dilute the point."}]},{"type":"p","runs":[{"t":"Now a lot of the relay baton work is done by software. Drafts, variations, basic layouts, summaries, first-pass analysis, the endless “make it shorter, make it punchier, now do ten versions.” That used to be paid labour. Now it’s a button. So the threat isn’t that “robots will take your job” in some dramatic overnight way. The threat is that the middle of the org chart, the part built to move work along and tidy it up, gets thinner because there’s less to move and less to tidy."}]},{"type":"p","runs":[{"t":"You can feel it already in the kind of tasks that used to justify whole roles. First draft copy. Basic competitor tables. Social calendars. Slide clean-up. Even the polite meeting notes that everyone pretends to read. They can still be done by people, but the economic argument for needing so many people to do them has cracked. Most teams haven’t faced the real implication yet."}]},{"type":"p","runs":[{"t":"They’re still improving workflows that exist mainly because execution used to be slow, expensive, and annoying. They’re still hiring for narrow slices of output, even as output becomes the cheapest thing in the room."}]},{"type":"p","runs":[{"t":"This doesn’t mean the work goes away. It means the shape of the work changes. A smaller team can now ship a first version without waiting two weeks for the slot, the resource, the review, the rewrite, the reschedule. That speed is not automatically good, but it is real. And it forces a question most marketing teams don’t like answering, which is: if the work can be produced quickly, what exactly are we being paid for. The answer isn’t “more content.” Nobody is crying out for more content. The answer is direction. Taste. The ability to make a call under uncertainty and stand over it. The ability to say no to the shiny wrong thing. The ability to spot the quiet risk before it becomes a public one."}]},{"type":"p","runs":[{"t":"Software will happily produce a hundred plausible routes. It will not carry the consequences of choosing the wrong one. It won’t sit in the room when sales are down and the board asks why. It won’t be the person whose name is on the decision."}]},{"type":"p","runs":[{"t":"That’s why teams that win won’t just “use AI.” Everyone is doing that now. The teams that win will rebuild around fewer handoffs and clearer ownership. Fewer people passing work along, more people capable of taking a piece end to end, from question to draft to test to fix."}]},{"type":"p","runs":[{"t":"The robots have already moved in."}]},{"type":"h1","text":"The algorithm will see you now"},{"type":"p","runs":[{"t":"A lad beside me in a café tapped “Add to basket” and stared at a spinning wheel. Four seconds, maybe five, then he stood up, left the coffee, and walked out like the website had slagged him off. The barista had written “DAVE?” on his cup in thick marker, all caps."}]},{"type":"p","runs":[{"t":"It’s not impatience, it’s training. We’ve all been trained by feeds and apps and one-click everything to treat friction like a fault, and we punish it instantly."}]},{"type":"p","runs":[{"t":"Offline, you used to fight for eye-level shelf space. Get into Tesco, pay for the end cap, make sure the packaging holds up under fluorescent lights, job done. Online, your customer types “best” and two other words, and a system decides what they see, in what order, and whether you even deserve to be there."}]},{"type":"p","runs":[{"t":"The brutal part is how quiet it is. There’s no manager telling you you’re underperforming. There’s a small drop in click-through, a few extra bounces, a handful of people who don’t wait for the page to load, and you’re out of the running before your brand story has even turned up."}]},{"type":"p","runs":[{"t":"My dad used to say a rushed diagnosis is just a polite misdiagnosis. Algorithms don’t do polite. They do fast. They make a call in microseconds off scraps of behaviour, and they never ring you afterwards to explain themselves."}]},{"type":"p","runs":[{"t":"And your logo, your long heritage, the year you were founded, the awards you won last year, none of it buys you much when the page takes a beat too long to appear. If the site feels like it’s running on dial-up, you’re not “losing attention.” You’re failing an entry test. A neighbour of mine is convinced marketing is still mostly a sharp logo and the right golf handicap. Lovely man. He’s arguing with a machine that doesn’t play golf and doesn’t care who you know."}]},{"type":"p","runs":[{"t":"So what do you do with that, other than have a small cry into your tea. Start with the boring stuff you’ve been ignoring because it didn’t feel like “marketing.” Speed. Clarity. The obvious answers in plain language. The bits that let a tired person get what they came for without working hard. If you want to see how your brand really performs, don’t do the grand brand workshop."}]},{"type":"p","runs":[{"t":"Open your own site on bad Wi-Fi, on an old phone, with your thumb. Try to buy. Try to find the one thing customers always ask you in support tickets. Count how many times you swear."}]},{"type":"p","runs":[{"t":"Next, assume you are being scored all the time. Every delay, every confusing label, every dead-end page is a little vote against you. People don’t leave you a review saying “your checkout was fiddly.” They just vanish. This is where AI is useful in a very unsexy way. Let it help you spot the leaks. Summarise the complaints. Cluster the “I couldn’t find” messages. Rewrite the help article so a human can skim it, and so a machine can lift the one sentence answer without guessing. Use it to clear the debris."}]},{"type":"p","runs":[{"t":"But don’t fall into the trap of thinking the algorithm is your customer. It’s not. It’s the bouncer on the door. Passing the bouncer gets you into the room. Once you’re in, you still have to be worth staying with. The machine can decide what shows up. It can’t decide what gets remembered."}]},{"type":"p","runs":[{"t":"That’s still the human job. Not “make content.” Make meaning. Give people a reason to recognise you again when the options blur together, and the shortlist looks the same."}]},{"type":"h1","text":"Everything. Everywhere. All at once"},{"type":"p","runs":[{"t":"My mate bought a vacuum between TikToks. Twelve minutes from \"I need a hoover\" to \"done, bought.\" No trip to Carrickmines, no asking friends which one they'd recommend, no proper comparing of models. Just need, algorithm, click, confirm."}]},{"type":"p","runs":[{"t":"Funny thing is it feels normal. Search engines figured out what he needed. Reviews told him which one worked. Price alerts told him when to buy. The whole thing happened in the time it takes to scroll past three cat videos."}]},{"type":"p","runs":[{"t":"How many categories is this happening in? If your brand isn't in the algorithm's shortlist, you're not even in the conversation."}]},{"type":"p","runs":[{"t":"Most marketing departments are still planning like it's 2019. We map out customer journeys that take weeks. We optimize funnels that assume people research and consider and evaluate. We compete against brands in our category, on the same shelf, pitching to the same buyer persona."}]},{"type":"p","runs":[{"t":"Yet my nine-year-old twins won't even consider restaurants under three stars. Not because they've had bad experiences. They just expect the algorithm to do the choosing for them. When they need to know something, they open my ChatGPT app before they google. That's their normal."}]},{"type":"p","runs":[{"t":"I'm watching a generation grow up where human choice and algorithmic filtering have blurred into something I don't fully understand yet. And I think most of us are missing what this means."}]},{"type":"p","runs":[{"t":"Visibility used to be about reach. Buy enough media, get in front of enough eyeballs, build enough awareness. As if that wasn't hard enough, now the algorithm decides who gets seen. And it optimizes for signals we barely track: speed, reviews, clicks, freshness, engagement, behavioural data we can't see."}]},{"type":"p","runs":[{"t":"Your beautifully crafted positioning statement? The algorithm didn't read it. Your brand strategy deck? Irrelevant. The system cares about whether people click, how long they stay, what they do next."}]},{"type":"p","runs":[{"t":"The brands that win aren't the biggest or loudest. They're the ones with better ratings, faster loading times, clearer descriptions, more recent reviews. The algorithm doesn't care about your brand equity. It cares about click-through rates and user behaviour."}]},{"type":"p","runs":[{"t":"My mate didn't choose between Dyson and Shark and Henry. The algorithm chose three options. He just clicked the middle one. Not a bad decision. I've a Shark."}]},{"type":"p","runs":[{"t":"My neighbour still drives to Currys, asks seventeen questions about hoovers, then buys whatever the salesman recommends. Purchases still happen that way, slowly, with consideration, with human advice. But for how long?"}]},{"type":"p","runs":[{"t":"The exceptions are spreading. And when they happen, everything we think we know about customer behaviour breaks down."}]},{"type":"p","runs":[{"t":"I won't lie. I'm not that pleased about all of this. But it's not hype. Of course there's AI hype, but it is also real."}]},{"type":"p","runs":[{"t":"Specs won't save you when this happens. Everyone has the same functional benefits. The algorithm will surface three options that solve the same problem, at similar prices, with similar ratings. The only thing left to compete on is meaning. Emotional relevance, clarity of stance, something that makes people remember you when the options blur together."}]},{"type":"p","runs":[{"t":"Three things seem clear. We need to understand how algorithms actually decide, not just reach and frequency, but the behavioural signals that drive visibility in the first place. We need to make meaning our competitive advantage, because when everything else is identical, emotional relevance is what breaks the tie. And we need to build for both worlds, because some customers still take weeks to decide while others choose between TikToks."}]},{"type":"p","runs":[{"t":"For now, the diagnosis matters more than the solution. We're not just competing with other brands anymore. We're competing with whatever the algorithm thinks is more relevant at that moment."}]},{"type":"h1","text":"Average is the new invisible"},{"type":"p","runs":[{"t":"My family shops like extremists. Not because we're picky, or because we're cheap, but because algorithms trained us to forget that average things exist."}]},{"type":"p","runs":[{"t":"Our shopping basket tells the story: top-shelf pistachios next to rock-bottom cereal. Fancy runners beside discount flip-flops. Expensive shampoo (not mine) and €1.99 body wash. We're an ordinary, average household that ignores the average. By design, but not our design."}]},{"type":"p","runs":[{"t":"We're not alone. Google Maps has a button that lets you filter out anything below 4.5 stars. Just tap it. Every decent-but-not-exceptional business vanishes. That's not a search feature. That's a Delete Average button."}]},{"type":"p","runs":[{"t":"Seth Godin talked about being remarkable decades ago, with his wonderful Purple Cow book."}]},{"type":"p","runs":[{"t":"Clearly the robots have been swotting up on their marketing and decided to just go ahead and implement this reality. Seth's insight twenty-plus years ago: be remarkable or be invisible. I remember it. It's a good book. His general thesis was that the way to win was to create something worth talking about, a purple cow in a field of ordinary brown ones. Most of us don't. Because it's hard. Bit like fame campaigns. They are the most profitable, but not easy to pull off. So while we settle for ok, our robot friends are off building a world for us where only purple cows survive."}]},{"type":"p","runs":[{"t":"Amazon's first three search results capture 64% of clicks. Products with 4.5+ stars get three times more attention than ones slightly less impressive, the ones that get between 4.0 and 4.4 stars. Their Amazon Buy Box dominates sales but only rewards extremes: lowest prices or highest performance."}]},{"type":"p","runs":[{"t":"This creates a squeeze. If you're not the cheapest option, you better be exceptional at delivery speed, customer service, and maintaining high ratings. There's very little room for \"decent price with ok service.\"No middle ground. Just best or cheapest. No room for beige cows."}]},{"type":"p","runs":[{"t":"Long run, this might be a good thing. For one, let's stop testing into sameness. A/B testing has its value. I spent a decade in direct marketing. But this type of testing is about efficiency, not necessarily effectiveness. To stand out, we need remarkable, unforgettable, even weird."}]},{"type":"p","runs":[{"t":"Every time we optimize for \"good enough,\" we're optimizing for invisibility. The middle wasn't murdered. It was simply made inefficient. And efficiency is all the robots care about."}]},{"type":"p","runs":[{"t":"This is the end of Part 1."}]},{"type":"p","runs":[{"t":"This was about the collapse. Our marketing structure collapsed. The layered, titled, ritualized system we built for a world that no longer exists."}]},{"type":"p","runs":[{"t":"Our execution advantage collapsed. AI made average production free, shifted value from polish to judgment. Our visibility collapsed. The algorithm became the gatekeeper. We lost control."}]},{"type":"p","runs":[{"t":"Now we compete with expectations, not just competitors. Our competition collapsed. We're not fighting in categories anymore. We're fighting for algorithmic shortlist status. The system decides who gets seen."}]},{"type":"p","runs":[{"t":"And the middle collapsed. The once-safe compromise between quality and cost where most brands lived."}]}],"cover_text":false,"id":"98636bf653"}</script>
<script>
(() => {
const B = JSON.parse(document.getElementById('book-data').textContent);
const $ = s => document.querySelector(s), root = document.documentElement;
const book = $('#book'), sideL = $('.side.L'), sideR = $('.side.R'), stage = $('#stage');
const KEY = 'webbook:' + (B.id || B.title);
const store = { get(k, d) { try { const v = localStorage.getItem(KEY + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const facsimile = B.blocks.filter(b => b.type === 'page').length > B.blocks.length * .6;

let pages = [{ kind: 'cover', first: 0 }], chapters = [], pos = 0, spread = true, busy = false, scale = store.get('scale', 1), marks = store.get('marks', []),
    sound = store.get('sound', false), query = '', R = .69;
if (facsimile) { const p = B.blocks.find(b => b.type === 'page'); R = p.w / p.h; }
const savedTheme = store.get('theme', null); if (savedTheme) root.dataset.theme = savedTheme;

/* ---------- blocks -> html ---------- */
const WRAP = { b: 'b', i: 'i', c: 'code', s: 'sup' };
function tokens(b) {            // words that carry their own style, so a paragraph can break across pages anywhere
  const runs = b.runs || [{ t: b.text || '' }], out = [];
  for (const r of runs) for (const w of r.t.split(/(?<=\s)/)) if (w) out.push({ w, s: r.s || '', h: r.href || '' });
  return out;
}
function inline(tk) {
  let html = '', i = 0;
  while (i < tk.length) {
    let j = i, t = ''; while (j < tk.length && tk[j].s === tk[i].s && tk[j].h === tk[i].h) t += tk[j++].w;
    let h = esc(t); for (const c of tk[i].s) if (WRAP[c]) h = `<${WRAP[c]}>${h}</${WRAP[c]}>`;
    if (tk[i].h && /^https?:/i.test(tk[i].h)) h = `<a href="${esc(tk[i].h)}" target="_blank" rel="noopener">${h}</a>`;
    html += h; i = j;
  }
  return html;
}
const itemTokens = it => tokens(typeof it === 'string' ? { text: it } : { runs: it });
function figSize(b, iw, ih) { const k = Math.min(iw / b.w, (ih * (b.caption ? .58 : .66)) / b.h, 1.6); return [Math.round(b.w * k), Math.round(b.h * k)]; }
function blockEl(b, iw, ih) {
  const d = document.createElement('div');
  if (b.type === 'h1') d.innerHTML = `<header class="chap">${B.number_chapters === false ? '' : `<span class="no">${esc(B.chapter_word || 'Chapter')} ${b._n}</span>`}<h1>${esc(b.text)}</h1><i class="rule"></i></header>`;
  else if (b.type === 'h2' || b.type === 'h3') d.innerHTML = `<${b.type}>${esc(b.text)}</${b.type}>`;
  else if (b.type === 'quote') d.innerHTML = `<blockquote>${inline(tokens(b))}</blockquote>`;
  else if (b.type === 'pre') d.innerHTML = `<pre>${esc(b.text)}</pre>`;
  else if (b.type === 'img') { const [w, h] = figSize(b, iw, ih);
    d.innerHTML = `<figure><img src="${b.src}" width="${w}" height="${h}" style="width:${w}px;height:${h}px" alt="${esc(b.alt || b.caption || '')}">${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>`; }
  else if (b.type === 'table') d.innerHTML = `<table><thead><tr>${b.rows[0].map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${b.rows.slice(1).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${b.caption ? `<p class="small">${esc(b.caption)}</p>` : ''}`;
  return d.firstElementChild;
}

/* ---------- pagination: pour blocks into pages, measuring real layout ---------- */
function paginate() {
  const M = $('#measure .inner'), iw = M.clientWidth, ih = M.clientHeight;
  pages = [{ kind: 'cover', first: 0 }]; chapters = [];
  let chap = '', nchap = 0, first = 0, afterHead = false;
  const fits = () => M.scrollHeight <= M.clientHeight + 1;
  const push = (kind) => { if (!M.childNodes.length && kind !== 'full') return;
    pages.push({ kind: kind || 'text', html: M.innerHTML, chap, first, text: [...M.children].map(c => c.textContent).join(' ') }); M.innerHTML = ''; };
  const breakPage = () => {      // never leave a heading stranded at the foot of a page
    const last = M.lastElementChild, carry = last && /^H[23]$/.test(last.tagName) && M.children.length > 1 ? last : null;
    if (carry) carry.remove(); push(); if (carry) M.appendChild(carry);
  };
  B.blocks.forEach((b, bi) => {
    if (!M.childNodes.length) first = bi;
    if (b.type === 'page') { push(); first = bi; pages.push({ kind: 'full', html: `<img src="${b.src}" alt="Page ${b.page}">`, chap, first: bi, text: b.text || '' }); return; }
    if (b.type === 'break') { push(); return; }
    if (b.type === 'h1') { push(); first = bi; chap = b.text; b._n = ++nchap; chapters.push({ t: b.text, l: 1, page: pages.length }); }
    if (b.type === 'h2') chapters.push({ t: b.text, l: 2, page: -1, bi });
    if (b.type === 'p' || b.type === 'list') {
      const isList = b.type === 'list', units = isList ? b.items : tokens(b);
      let start = 0, guard = 0;
      while (start < units.length && guard++ < 400) {
        let el;
        const fill = n => { const part = units.slice(start, start + n);
          if (isList) el.innerHTML = part.map(it => `<li>${inline(itemTokens(it))}</li>`).join(''); else el.innerHTML = inline(part); };
        if (isList) { el = document.createElement(b.ordered ? 'ol' : 'ul'); if (b.ordered) el.start = start + 1; }
        else { el = document.createElement('p'); if (b.small) el.className = 'small';
          if (start) el.classList.add('cont'); else if (afterHead === 'h1' && /^["“‘']?[A-Za-zÀ-ÿ]/.test(b.text || b.runs[0].t) && units.length > 25) el.classList.add('lead'); }
        M.appendChild(el); fill(units.length - start);
        if (fits()) break;
        let lo = 0, hi = units.length - start - 1;       // largest slice that still fits
        while (lo < hi) { const mid = (lo + hi + 1) >> 1; fill(mid); fits() ? lo = mid : hi = mid - 1; }
        const min = isList ? 1 : 14;
        if (lo < min && M.children.length > 1) { el.remove(); breakPage(); continue; }   // too little room: start it on the next page
        lo = Math.max(lo, 1); fill(lo); if (!isList) el.classList.add('split');
        if (el.classList.contains('lead') && lo < 40) el.classList.remove('lead');
        start += lo; push();
      }
      if (pages.length && M.children.length === 1 && M.firstElementChild.classList.contains('cont')) first = bi;
    } else {
      const el = blockEl(b, iw, ih); if (!el) return;
      M.appendChild(el);
      if (b.type === 'table' && b.caption) M.appendChild(Object.assign(document.createElement('p'), { className: 'small', textContent: b.caption }));
      if (!fits() && M.children.length > 1) { el.remove(); breakPage(); M.appendChild(el); }
      if (!fits() && b.type === 'table') el.style.fontSize = '.6em';
    }
    if (b.type === 'h2') chapters[chapters.length - 1].page = pages.length;
    afterHead = /^h[123]$/.test(b.type) ? b.type : false;
  });
  push();
  pages.push({ kind: 'end', first: B.blocks.length });
  if (pages.length % 2) pages.splice(pages.length - 1, 0, { kind: 'blank', first: B.blocks.length });
  let n = 0; pages.forEach(p => { if (p.kind === 'text' || p.kind === 'full') p.no = ++n; });
  const sc = $('#scrub'); sc.max = pages.length - 1;
}

/* ---------- drawing a page ---------- */
function pageEl(i, enterDelay) {
  const el = document.createElement('div'), p = pages[i]; el.className = 'page';
  if (!p) { el.classList.add('void'); return el; }
  if (p.kind === 'cover') { el.classList.add('cover');
    const art = B.theme && B.theme.cover && B.theme.cover !== 'type' ? `<img class="art" src="${B.theme.cover}" alt="">` : '<canvas></canvas>';
    el.innerHTML = art + (B.theme && B.theme.cover_text === false ? '' : `<div class="cv"><div><h1>${esc(B.title)}</h1>${B.subtitle ? `<div class="sub">${esc(B.subtitle)}</div>` : ''}</div><div><div class="by">${esc(B.author || '')}</div><div class="open">Open the cover →</div></div></div>`);
    const c = el.querySelector('canvas'); if (c) requestAnimationFrame(() => coverArt(c));
  } else if (p.kind === 'end') { el.classList.add('end');
    el.innerHTML = `<div class="inner"><b>${esc(B.title)}</b><span>${pages.filter(x => x.no).length} pages${B.source ? ' · made from ' + esc(B.source) : ''}</span><button data-go="0">Back to the cover</button></div>`;
  } else if (p.kind === 'blank') { el.innerHTML = ''; }
  else { if (p.kind === 'full') el.classList.add('full');
    el.innerHTML = `<div class="runhead"><span>${esc(B.title)}</span><span>${esc(p.chap || '')}</span></div><div class="inner">${p.html}</div><div class="folio">${p.no}</div>`;
    if (isMarked(i)) el.insertAdjacentHTML('beforeend', '<i class="ribbon"></i>');
    if (query) highlight(el.querySelector('.inner'), query);
  }
  if (enterDelay != null && !reduce) { el.classList.add('enter'); el.style.setProperty('--d', enterDelay + 's'); }
  return el;
}
function put(side, i, d) { side.replaceChildren(pageEl(i, d)); }
function highlight(node, q) {
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT), hits = []; let n;
  while ((n = w.nextNode())) { const k = n.data.toLowerCase().indexOf(q); if (k >= 0) hits.push([n, k]); }
  for (const [t, k] of hits) { const r = document.createRange(); r.setStart(t, k); r.setEnd(t, k + q.length); const m = document.createElement('mark'); try { r.surroundContents(m); } catch (e) {} }
}
function coverArt(c) {          // a pattern grown from the title, so every book gets its own cover
  const w = c.width = c.clientWidth * 2, h = c.height = c.clientHeight * 2, g = c.getContext('2d');
  let s = 0; for (const ch of B.title) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const cx = w * (.2 + rnd() * .6), cy = h * (.45 + rnd() * .3), n = 26 + (rnd() * 20 | 0), tilt = rnd() * Math.PI;
  g.lineWidth = Math.max(1.5, w / 380); g.strokeStyle = '#fff';
  for (let i = 0; i < n; i++) { const r = (i + 1) * w / n * .9, a = tilt + i * (.11 + rnd() * .05);
    g.globalAlpha = .25 + .75 * (1 - i / n); g.beginPath(); g.ellipse(cx, cy, r, r * (.55 + rnd() * .1), a, 0, Math.PI * (1.1 + rnd() * .9)); g.stroke(); }
}

/* ---------- geometry ---------- */
function layout() {
  const aw = stage.clientWidth - 32, ah = stage.clientHeight - 10;
  spread = R < 1 && aw >= 820 && aw / ah > 1.18;
  let r = R; if (!spread && !facsimile) r = Math.min(.8, Math.max(.56, aw / ah));
  let ph = Math.min(ah, 940), pw = ph * r; const mw = aw / (spread ? 2 : 1);
  if (pw > mw) { pw = mw; ph = pw / r; }
  pw = Math.floor(pw); ph = Math.floor(ph);
  root.style.setProperty('--pw', pw + 'px'); root.style.setProperty('--ph', ph + 'px');
  root.style.setProperty('--pad', Math.round(pw * (spread ? .1 : .075)) + 'px');
  root.style.setProperty('--fs', (Math.min(19, Math.max(14.5, pw * .037)) * scale).toFixed(2) + 'px');
  book.classList.toggle('single', !spread);
}
const sOf = p => Math.ceil(p / 2);
function show() {
  if (spread) { const s = sOf(pos); put(sideL, s ? 2 * s - 1 : -1); put(sideR, 2 * s); book.classList.toggle('closed', s === 0); }
  else { put(sideR, pos); book.classList.remove('closed'); }
  ui();
}
function anchorBlock() { const p = pages[spread && pos > 0 ? Math.max(1, 2 * sOf(pos) - 1) : pos]; return p ? p.first : 0; }
function pageOfBlock(bi) { let k = 0; for (let i = 0; i < pages.length; i++) if (pages[i].first <= bi && pages[i].kind !== 'blank' && pages[i].kind !== 'end') k = i; return k; }
function rebuild(keep) {
  const a = keep == null ? anchorBlock() : keep, atCover = pos === 0 && keep == null;
  layout(); paginate(); pos = atCover ? 0 : Math.min(pages.length - 1, pageOfBlock(a)); show(); drawToc();
}

/* ---------- turning ---------- */
let flip = null;
function begin(target) {
  if (busy || target === pos || target < 0 || target >= pages.length) return null;
  const dir = target > pos ? 1 : -1, leaf = document.createElement('div'), f = document.createElement('div'), b = document.createElement('div');
  leaf.className = 'leaf ' + (dir > 0 ? 'fwd' : 'back'); f.className = 'face front'; b.className = 'face back';
  let s0 = sOf(pos), s1 = sOf(target);
  if (spread) {
    if (s0 === s1) { pos = target; ui(); return null; }
    if (dir > 0) { f.append(pageEl(2 * s0)); b.append(pageEl(2 * s1 - 1, .32)); put(sideR, 2 * s1, .25); }
    else { f.append(pageEl(2 * s1, .32)); b.append(pageEl(2 * s0 - 1)); put(sideL, s1 ? 2 * s1 - 1 : -1, .25); }
    book.classList.toggle('closed', s1 === 0);
  } else {
    if (dir > 0) { f.append(pageEl(pos)); put(sideR, target, .2); } else { f.append(pageEl(target, .3)); }
  }
  for (const x of [f, b]) x.insertAdjacentHTML('beforeend', '<i class="dim"></i>');

}
function setP(p) {

  if (spread) { F.leaf.style.transform = `rotateY(${(F.dir > 0 ? -180 : 180) * p}deg)`;
    F.f.querySelector('.dim').style.opacity = F.dir > 0 ? bend * .28 : bend * .1; F.b.querySelector('.dim').style.opacity = F.dir > 0 ? bend * .1 : bend * .28; }
  else { const q = F.dir > 0 ? p : 1 - p; F.leaf.style.transform = `rotateY(${-104 * q}deg)`; F.leaf.style.opacity = q > .82 ? (1 - q) / .18 : 1; F.f.querySelector('.dim').style.opacity = q * .3; }
}
function settle(to, ms) {
  const F = flip; if (!F) return; const from = F.p, t0 = performance.now(), dur = reduce ? 0 : ms * Math.abs(to - from);
  if (to === 1) whoosh();

    setP(from + (to - from) * e);

    F.leaf.remove(); flip = null; busy = false; if (to === 1) pos = F.target; show(); save(); };
  requestAnimationFrame(tick);
}
function go(target) { target = Math.max(0, Math.min(pages.length - 1, target)); if (begin(target)) settle(1, 760); }
const step = d => { if (spread) { const s = sOf(pos) + d; go(s <= 0 ? 0 : 2 * s - 1); } else go(pos + d); };

/* drag a page edge (or swipe on touch) to turn it by hand */
let drag = null;
book.addEventListener('pointerdown', e => {
  if (busy || e.target.closest('a,button:not(.edge),img')) return;
  const onEdge = e.target.classList.contains('edge');
  if (!onEdge && e.pointerType === 'mouse') return;
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId, onEdge, dir: onEdge ? (e.target.classList.contains('next') ? 1 : -1) : 0, on: false };
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.on) { if (Math.abs(dx) < 10 || Math.abs(dy) > Math.abs(dx)) return;
    const d = dx < 0 ? 1 : -1, t = spread ? (sOf(pos) + d <= 0 ? 0 : 2 * (sOf(pos) + d) - 1) : pos + d;
    if (!begin(t)) { drag = null; return; } drag.on = true; drag.d = d; }
  const w = parseFloat(getComputedStyle(root).getPropertyValue('--pw')) * (spread ? 1.5 : .9);
  setP(Math.max(0, Math.min(1, (-dx * drag.d) / w)));
});
addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return; const d = drag; drag = null;
  if (d.on) return settle(flip.p > .22 ? 1 : 0, 760);
  if (d.onEdge && Math.abs(e.clientX - d.x) < 6) step(d.dir);
});
addEventListener('pointercancel', () => { if (drag && drag.on) settle(0, 500); drag = null; });
book.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) return go(+g.dataset.go);
  const im = e.target.closest('figure img'); if (im) { $('#light img').src = im.src; $('#light').hidden = false; }
});
$('#light').onclick = () => $('#light').hidden = true;
stage.addEventListener('wheel', e => { if (e.target.closest('.drawer')) return; if (Math.abs(e.deltaX) > 30 && Math.abs(e.deltaX) > Math.abs(e.deltaY) && !busy) step(e.deltaX > 0 ? 1 : -1); }, { passive: true });
addEventListener('keydown', e => {
  if (e.target.matches('input')) { if (e.key === 'Escape') closeDrawers(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(pages.length - 1);
  else if (e.key === '/') { e.preventDefault(); openFind(); } else if (e.key === 'b' || e.key === 'B') toggleMark();
  else if (e.key === 'Escape') { closeDrawers(); $('#light').hidden = true; }
});

/* ---------- sound: a short burst of shaped noise, made on the spot ---------- */
let ac;
function whoosh() {
  if (!sound) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const n = ac.sampleRate * .32, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { const t = i / n; d[i] = (Math.random() * 2 - 1) * Math.pow(Math.sin(t * Math.PI), 2) * (1 - t) * .5; }
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); src.buffer = buf; f.type = 'bandpass'; f.Q.value = .7;
    f.frequency.setValueAtTime(900, ac.currentTime); f.frequency.exponentialRampToValueAtTime(4200, ac.currentTime + .3); g.gain.value = .35;
    src.connect(f).connect(g).connect(ac.destination); src.start(); } catch (e) {}
}

/* ---------- chrome ---------- */
function visible() { return spread ? [2 * sOf(pos) - 1, 2 * sOf(pos)].filter(i => pages[i] && pages[i].no) : (pages[pos].no ? [pos] : []); }
function range(i) { let j = i + 1; while (pages[j] && pages[j].kind === 'blank') j++; return [pages[i].first, pages[j] ? pages[j].first : 1e9]; }
function isMarked(i) { const [a, z] = range(i); return marks.some(m => m.b >= a && (m.b < z || (m.b === a && z === a))); }
function ui() {
  const v = visible(), total = pages.filter(p => p.no).length, p = pages[v.length ? v[v.length - 1] : pos];
  $('#where').textContent = v.length ? (v.length > 1 ? `${pages[v[0]].no}–${pages[v[1]].no}` : pages[v[0]].no) + ' of ' + total : (pos === 0 ? 'Cover' : 'The end');
  $('#scrub').value = pos; $('#t-chap').textContent = p && p.chap || '';
  const wordsLeft = pages.slice(pos + 1).reduce((n, x) => n + (x.text ? x.text.split(/\s+/).length : 0), 0), min = Math.round(wordsLeft / 230);
  $('#left').textContent = facsimile ? '' : min < 1 ? 'Under a minute left' : min + ' min left';
  $('#b-mark').setAttribute('aria-pressed', v.some(isMarked));
  $('.edge.prev').hidden = pos === 0; $('.edge.next').hidden = sOf(pos) === sOf(pages.length - 1) && (spread || pos === pages.length - 1);
  document.querySelectorAll('#toc-list .row').forEach(r => r.classList.remove('cur'));
}
function save() { store.set('at', anchorBlock()); }
function drawToc() {
  const rows = chapters.filter(c => c.page > 0).map(c => `<button class="row l${c.l}" data-go="${c.page}"><span>${esc(c.t)}</span><span class="n">${pages[c.page] && pages[c.page].no || ''}</span></button>`).join('');
  const bm = marks.map(m => { const i = pageOfBlock(m.b); return `<button class="row" data-go="${i}"><span>${esc(m.t)}</span><span class="n">${pages[i].no || ''}</span></button>`; }).join('');
  $('#toc-list').innerHTML = (rows || '<div class="empty">This book has no chapter headings.</div>') + (bm ? '<h2 style="padding-left:10px">Bookmarks</h2>' + bm : '');
}
function closeDrawers() { $('#toc').hidden = $('#find').hidden = true; }
function openFind() { $('#toc').hidden = true; $('#find').hidden = false; $('#q').focus(); }
function toggleMark() {
  const v = visible(); if (!v.length) return; const on = v.filter(isMarked);
  if (on.length) for (const i of on) { const [a, z] = range(i); marks = marks.filter(m => !(m.b >= a && (m.b < z || z === a))); }
  else { const p = pages[v[0]]; const para = /<p[^>]*>(.*?)<\/p>/.exec(p.html || ''), snip = para ? para[1].replace(/<[^>]+>/g, '').slice(0, 46) + '…' : 'page ' + p.no;
    marks.push({ b: p.first, t: (p.chap ? p.chap + ' · ' : '') + snip }); }
  store.set('marks', marks); show(); drawToc();
}
$('#b-toc').onclick = () => { $('#find').hidden = true; $('#toc').hidden = !$('#toc').hidden; };
$('#b-find').onclick = () => $('#find').hidden ? openFind() : closeDrawers();
$('#b-mark').onclick = toggleMark;
$('#b-theme').onclick = () => { const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme); };
$('#b-sound').onclick = () => { sound = !sound; store.set('sound', sound); $('#b-sound').setAttribute('aria-pressed', sound); if (sound) whoosh(); };
$('#b-sound').setAttribute('aria-pressed', sound);
const resize = d => { scale = Math.max(.8, Math.min(1.45, +(scale + d).toFixed(2))); store.set('scale', scale); rebuild(); };
$('#b-small').onclick = () => resize(-.1); $('#b-big').onclick = () => resize(.1);
$('#toc').addEventListener('click', e => { const r = e.target.closest('[data-go]'); if (r) { closeDrawers(); go(+r.dataset.go); } });
$('#scrub').addEventListener('input', e => { const p = pages[+e.target.value]; $('#where').textContent = p.no ? 'Go to ' + p.no : p.kind === 'cover' ? 'Cover' : 'The end'; });
$('#scrub').addEventListener('change', e => go(+e.target.value));
$('#q').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase(); const out = [];
  if (query.length > 1) pages.forEach((p, i) => { if (!p.text) return; const t = p.text, k = t.toLowerCase().indexOf(query); if (k < 0) return;
    const a = Math.max(0, k - 40); out.push(`<button class="row" data-go="${i}"><span>${a ? '…' : ''}${esc(t.slice(a, k))}<mark>${esc(t.slice(k, k + query.length))}</mark>${esc(t.slice(k + query.length, k + query.length + 60))}…</span><span class="n">${p.no}</span></button>`); });
  else query = '';
  $('#hits').innerHTML = out.join('') || `<div class="empty">${query ? 'No page contains that.' : 'Type at least two letters.'}</div>`; show();
});
$('#find').addEventListener('click', e => { const r = e.target.closest('[data-go]'); if (r) { if (innerWidth < 900) $('#find').hidden = true; +r.dataset.go === pos ? show() : go(+r.dataset.go); } });

/* ---------- start ---------- */
$('#t-title').textContent = B.title;
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!busy) rebuild(); }, 180); });
function start() {
  rebuild(0); pos = 0;
  const m = /^#p(\d+)$/.exec(location.hash); if (m) { const i = pages.findIndex(p => p.no === +m[1]); if (i > 0) pos = i; }
  show(); sideR.firstElementChild.classList.add('enter');
  const at = store.get('at', 0), back = pageOfBlock(at);
  if (!m && at > 0 && back > 1 && pages[back].no) { const t = $('#toast'); t.innerHTML = `<span>You stopped on page ${pages[back].no}</span><button>Continue</button>`; t.hidden = false;
    t.querySelector('button').onclick = () => { t.hidden = true; go(back); }; setTimeout(() => t.hidden = true, 9000); }
  window.webbook = { go, step, pages: () => pages, pos: () => pos, state: () => ({ pages: pages.length, numbered: pages.filter(p => p.no).length, spread, chapters: chapters.length }) };
}
layout(); show();   /* cover is on screen at once; the text is poured when the fonts have arrived */
const faces = []; for (const f of [B.theme && B.theme.body_font, B.theme && B.theme.display_font]) if (f) for (const v of ['', 'italic ', '600 ']) faces.push(v + '16px "' + f + '"');
const loaded = document.fonts ? Promise.all(faces.map(f => document.fonts.load(f).catch(() => 0))) : 0;   /* ask for every face up front: text measured in a fallback font would overflow later */
Promise.race([loaded, new Promise(r => setTimeout(r, 2500))]).then(() => { start();
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { clearTimeout(rz); rz = setTimeout(() => { if (!busy) rebuild(); }, 250); }); });
})();
</script>
