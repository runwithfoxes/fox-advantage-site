  <script>
    var f = [document.getElementById('f1'), document.getElementById('f2'), document.getElementById('f3')];
    function seek(t) {
      var p = ((t % 1) + 1) % 1 * 3, idx = Math.floor(p) % 3, fr = p - Math.floor(p);
      var fadeStart = 0.84, op = [0, 0, 0];
      if (fr < fadeStart) { op[idx] = 1; }
      else { var k = (fr - fadeStart) / (1 - fadeStart); op[idx] = 1 - k; op[(idx + 1) % 3] = k; }
      for (var i = 0; i < 3; i++) f[i].style.opacity = op[i];
