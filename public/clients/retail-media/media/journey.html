<!doctype html>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#FAFAF8;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1E1E1C;padding:6px 2px 18px;}
  .stage{margin:0 0 6px;}
  .stagehead{display:flex;align-items:center;gap:12px;margin:18px 4px 12px;}
  .stagehead:first-child{margin-top:4px;}
  .stagehead .n{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8A867C;font-weight:700;white-space:nowrap;}
  .stagehead .rule{flex:1;height:1px;background:#E6E3DC;}
  .row{display:flex;flex-wrap:wrap;gap:20px;padding:0 4px;}
  .tile{width:210px;}
  .frame{height:150px;background:#F1EFEA;border:1px solid #E6E3DC;border-radius:8px;
         display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .frame.live{border-color:#BFE0C4;}
  .frame img{max-height:132px;max-width:188px;width:auto;height:auto;display:block;
             box-shadow:0 2px 10px rgba(0,0,0,.16);border-radius:2px;}
  .ph{border:1.5px dashed #CFCBC1;border-radius:3px;display:flex;align-items:center;justify-content:center;}
  .ph span{font-size:10px;letter-spacing:.08em;color:#A8A49A;font-weight:600;}
  .cap{margin:9px 2px 0;}
  .cap .name{font-size:13.5px;font-weight:700;}
  .cap .fmt{font-size:11.5px;color:#6B675F;margin-top:1px;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .dot.live{background:#12922B;} .dot.build{background:#C9C4B8;}
</style>
<div id="j"></div>
<script>
const STAGES = [
  ["At home", [[1,"eCRM email","node1-email-hero-landscape.png","Email hero",16,9]]],
  ["Online", [
    [2,"Tesco.ie MPU","mpu.png","Display · 300×250",300,250],
    [3,"Tesco social","social-square.png","Social · 1080×1080",1,1]]],
  ["On the way", [[4,"Convenience wrap","store-wrap.png","Store wrap · 720×1800",720,1800]]],
  ["Into the store", [
    [5,"JCD screen","screen-still.png","Screen · 1080×1920",1080,1920],
    [6,"Totem screen","screen-still.png","Screen · 1080×1920",1080,1920],
    [7,"Hanging board",null,"Landscape board",16,6],
    [8,"Power-aisle strip",null,"Wide digital strip",16,4]]],
  ["The drinks zone", [
    [9,"Goal-post bundle","bundle-original-x-finest.png","Cross-collab bundle",1144,860],
    [11,"BWS gate · inside","node11-gate-inside.png","Gate panel · full alcohol",16,9],
    [10,"BWS gate · outside",null,"0.0 message panel",16,9],
    [12,"BWS special build",null,"In-bay screen · sound on",16,9]]],
];
let html="";
for(const [stage,nodes] of STAGES){
  html+=`<div class="stage"><div class="stagehead"><span class="n">${stage}</span><span class="rule"></span></div><div class="row">`;
  for(const [num,name,img,fmt,aw,ah] of nodes){
    const live=!!img;
    // fit the format's aspect inside 188x132 for the placeholder box
    let w,h; if(aw/ah > 188/132){w=188;h=Math.round(188*ah/aw);} else {h=132;w=Math.round(132*aw/ah);}
    const inner = live
      ? `<img src="${img}" alt="${name}">`
      : `<div class="ph" style="width:${w}px;height:${h}px;"><span>IN BUILD</span></div>`;
    html+=`<div class="tile">
      <div class="frame ${live?'live':''}">${inner}</div>
      <div class="cap">
        <div class="name">${num} · ${name}</div>
        <div class="fmt"><span class="dot ${live?'live':'build'}"></span>${fmt}</div>
      </div></div>`;
  }
  html+=`</div></div>`;
}
document.getElementById('j').innerHTML=html;
</script>
